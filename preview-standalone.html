<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Website Starter — Visual Preview</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{font-synthesis:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fffdf4;color:#193c2e;font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
::selection{background:#f4cb45;color:#123b2c}
:focus-visible{outline:3px solid #dfa600;outline-offset:4px}
.site{--primary:#145b3c;--primary-dark:#0f402d;--yellow:#f4cb45;--cream:#fffdf4;--tint:#e9f5e9;--ink:#173d2f;--muted:#61736a;--white:#fff;overflow:hidden;color:var(--ink);background:#fff}
.container{width:min(1200px,calc(100% - 72px));margin-inline:auto}
.demo-bar{background:#142f29;color:#fff;position:relative;z-index:20}
.demo-bar__inner{display:flex;gap:25px;align-items:center;justify-content:space-between;min-height:48px}
.demo-bar__label{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:800;letter-spacing:.16em;white-space:nowrap;color:#e1efe5}
.live-pip{width:7px;height:7px;border-radius:100%;background:#f4cb45;box-shadow:0 0 0 4px #f4cb4522}
.demo-bar__divider{opacity:.45}
.demo-options{display:flex;gap:5px;align-items:center}
.demo-options a{font-size:11px;font-weight:700;color:#e4e9df;padding:8px 13px;border-radius:40px;white-space:nowrap;transition:.2s}
.demo-options a:hover{background:#ffffff18}
.demo-options a.is-selected{background:#f4cb45;color:#183c2e}
.announcement{background:var(--primary);color:#fff}
.announcement__inner{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;font-weight:700;letter-spacing:.03em}
.announcement__spark{color:var(--yellow);font-size:18px;margin-right:7px;vertical-align:-2px}
.announcement a{display:flex;gap:10px;align-items:center;white-space:nowrap;color:var(--yellow);font-weight:800}
.announcement a:hover{text-decoration:underline}
.site-header{background:#fffdf8;position:relative;z-index:15;border-bottom:1px solid #163c2a0c}
.site-header__inner{display:flex;align-items:center;min-height:89px;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:11px;min-width:195px}
.brand__mark{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:15px;background:var(--primary);color:var(--yellow);font-family:'Manrope',sans-serif;font-weight:800;font-size:30px;line-height:1;transform:rotate(-5deg)}
.brand__words{display:flex;flex-direction:column;line-height:1.14;gap:5px}
.brand__words strong{font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.05em;color:var(--primary-dark)}
.brand__words small{font-size:10px;letter-spacing:.07em;font-weight:700;color:#688073;text-transform:uppercase}
.desktop-nav{display:flex;align-items:center;gap:26px}
.desktop-nav a{position:relative;font-size:12px;font-weight:700;color:#355648;white-space:nowrap;transition:color .2s}
.desktop-nav a:hover,.desktop-nav a.active{color:var(--primary)}
.desktop-nav a.active:after{content:'';width:100%;height:2px;background:var(--yellow);position:absolute;left:0;bottom:-10px;border-radius:5px}
.header-cta{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px;border-radius:8px;font-size:12px;font-weight:800;white-space:nowrap;transition:transform .2s,background .2s}
.header-cta:hover{transform:translateY(-2px);background:var(--primary-dark)}
.mobile-nav{display:none;position:relative}
.mobile-nav summary{cursor:pointer;list-style:none;display:grid;place-items:center;width:42px;height:42px;background:#e9f5e9;border-radius:10px;color:var(--primary)}
.mobile-nav summary::-webkit-details-marker{display:none}
.mobile-nav nav{position:absolute;right:0;top:calc(100% + 14px);width:min(350px,calc(100vw - 45px));display:flex;flex-direction:column;gap:2px;padding:13px;background:#fffdf8;border:1px solid #e4e9df;box-shadow:0 20px 50px #0e402c1d;border-radius:14px}
.mobile-nav nav a{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:8px;color:var(--primary-dark);font-weight:700;font-size:13px}
.mobile-nav nav a:hover,.mobile-nav nav a[aria-current=page]{background:#e9f5e9}
.hero{background:var(--cream);position:relative;padding:74px 0 91px}
.hero:before{position:absolute;content:'';inset:0;background-image:radial-gradient(#276c4212 1px,transparent 1px);background-size:29px 29px;mask-image:linear-gradient(90deg,transparent 25%,black 100%);pointer-events:none}
.hero__grid{display:grid;grid-template-columns:1.02fr .98fr;gap:45px;align-items:center;position:relative}
.hero__copy{padding-bottom:15px}
.hero__eyebrow{display:inline-flex;align-items:center;gap:11px;padding:10px 13px 10px 10px;background:#e9f5e9;border:1px solid #d4e9d4;color:var(--primary);border-radius:30px;font-size:10px;font-weight:800;letter-spacing:.12em}
.hero__eyebrow-mark{display:grid;place-items:center;font-size:15px;color:var(--primary);background:var(--yellow);width:24px;height:24px;border-radius:50%}
.hero h1{font-family:'Manrope',Arial,sans-serif;color:var(--primary-dark);font-size:clamp(49px,5.4vw,77px);line-height:1.085;font-weight:800;letter-spacing:-.072em;margin:26px 0 23px;max-width:660px}
.hero h1 em{font-style:normal;position:relative;color:var(--primary);z-index:0}
.hero h1 em:after{content:'';position:absolute;left:-1%;right:-2%;bottom:0;height:14px;background:var(--yellow);opacity:.75;z-index:-1;transform:rotate(-2deg);border-radius:30px}
.hero__summary{color:#586d61;font-size:16px;line-height:1.9;max-width:540px;margin:0 0 30px}
.hero__actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.button{display:inline-flex;align-items:center;justify-content:center;gap:15px;border:1.5px solid transparent;border-radius:9px;padding:16px 21px;font-size:13px;font-weight:800;line-height:1.2;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.button:hover{transform:translateY(-3px);box-shadow:0 11px 24px #16442a1c}
.button--yellow{background:var(--yellow);color:var(--primary-dark)}
.button--outline{border-color:#b9cec0;color:var(--primary-dark);background:#fff9}
.button--dark{background:var(--primary);color:white}
.hero__footnote{display:flex;gap:15px;align-items:center;margin-top:47px}
.footnote-avatars{display:flex;padding-left:5px}
.footnote-avatars span{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:3px solid var(--cream);font-size:18px;color:var(--primary-dark);background:#f6d55c;margin-left:-6px}
.footnote-avatars span:nth-child(2){background:#c1e6c8}.footnote-avatars span:nth-child(3){background:#e5d4f0}
.hero__footnote>div:last-child{display:flex;flex-direction:column;gap:4px}
.hero__footnote strong{font-size:11px;color:var(--primary-dark)}
.hero__footnote small{font-size:10px;color:#728379}
.hero__visual{height:516px;position:relative;display:flex;align-items:center;justify-content:center}
.hero__art{position:relative;width:95%;height:96%;border-radius:46% 46% 28px 28px;background:#e9efdd;border:10px solid #fff;box-shadow:0 25px 65px #164c3225;overflow:hidden;transform:rotate(2deg)}
.hero__art img{width:100%;height:100%;object-fit:cover;transform:scale(1.05) rotate(-2deg)}
.hero__floating{background:white;box-shadow:0 16px 40px #21442d24;display:flex;align-items:center;position:absolute;z-index:2;color:var(--primary-dark)}
.hero__floating--top{gap:10px;padding:12px 17px;border-radius:14px;left:-24px;top:15%;transform:rotate(-6deg)}
.float-icon{background:#edf5e9;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--primary)}
.hero__floating--top span:last-child{display:flex;flex-direction:column;gap:5px}
.hero__floating--top strong{font-size:12px;font-weight:800}
.hero__floating--top small{font-size:10px;color:#687b70}
.hero__floating--bottom{bottom:7%;right:-17px;gap:11px;background:var(--yellow);padding:17px 21px;border-radius:12px;transform:rotate(-5deg);max-width:240px}
.hero__floating--bottom strong{font-size:12px;line-height:1.4}.hero__floating--bottom>span{font-size:28px}
.hero__star{position:absolute;font-size:51px;color:var(--yellow);right:-35px;top:6%;transform:rotate(13deg)}
.site--secondary .hero{background:var(--primary-dark)}
.site--secondary .hero:before{opacity:.22}
.site--secondary .hero h1{color:#fff}
.site--secondary .hero h1 em{color:var(--yellow)}
.site--secondary .hero h1 em:after{background:#6a9277;opacity:.4}
.site--secondary .hero__summary{color:#cfdfd2}
.site--secondary .hero__eyebrow{background:#ffffff18;border-color:#ffffff32;color:#f9eac2}
.site--secondary .hero__footnote strong{color:#fff}
.site--secondary .hero__footnote small{color:#bad0be}
.site--secondary .button--outline{background:transparent;border-color:#93b09e;color:#fff}
.site--secondary .hero__art{border-radius:22px 190px 22px 22px;border:7px solid #94b59a}
.site--secondary .hero__art img{transform:scale(1.05)}
.site--combined .hero{background:linear-gradient(120deg,#eef7eb 0%,#fffaf0 100%)}
.site--combined .hero__art{border-radius:24px 165px 24px 165px;transform:rotate(-2deg)}
.site--combined .hero__art img{transform:scale(1.06) rotate(2deg)}
.highlights{background:var(--yellow);color:var(--primary-dark)}
.highlights__grid{display:grid;grid-template-columns:repeat(3,1fr)}
.highlight{min-height:95px;display:flex;align-items:center;gap:19px;border-right:1px solid #19492c2d;padding:15px 30px}
.highlight:first-child{padding-left:0}.highlight:last-child{border-right:0;padding-right:0}
.highlight>span{font-size:12px;letter-spacing:.1em;opacity:.65;font-weight:800}
.highlight strong{font-size:15px;letter-spacing:-.035em;flex:1}.highlight svg{opacity:.65}
.section{padding:106px 0}
.section--soft{background:#f0f7ee}
.section--cream{background:var(--cream)}
.section-intro{max-width:690px}
.section-intro--center{text-align:center;margin-inline:auto}
.kicker{display:flex;align-items:center;gap:11px;color:var(--primary);font-weight:800;letter-spacing:.14em;font-size:10px;margin-bottom:21px}
.kicker__line{width:27px;height:2px;background:var(--yellow)}
.section-intro h2{font-family:'Manrope',Arial,sans-serif;font-weight:800;color:var(--primary-dark);letter-spacing:-.055em;font-size:clamp(32px,4vw,52px);line-height:1.17;margin:0 0 22px}
.section-intro p{font-size:15px;line-height:1.95;color:#65796c;max-width:565px;margin:0}
.intro-section__grid{display:grid;grid-template-columns:1fr .87fr;gap:120px;align-items:center}
.sticker-mini{color:var(--primary);display:inline-flex;align-items:center;gap:9px;font-size:9px;font-weight:800;letter-spacing:.12em;margin-bottom:14px}
.sticker-mini svg{color:#e6b524}
.inline-cta{display:inline-flex;align-items:center;margin-top:30px;color:var(--primary-dark);font-size:13px;font-weight:800}
.text-link{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--yellow);padding-bottom:8px;transition:gap .2s}
.inline-cta:hover .text-link{gap:20px}
.welcome-composition{position:relative;min-height:390px;padding:40px 36px 20px 0}
.welcome-composition__block{background:var(--primary);color:white;border-radius:155px 155px 28px 28px;height:100%;min-height:348px;padding:42px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.welcome-composition__block:before{content:'';position:absolute;right:-40px;top:-20px;width:200px;height:200px;border:2px solid #e4f0d352;border-radius:50%;box-shadow:0 0 0 40px #d0e2c710,0 0 0 80px #d0e2c710}
.welcome-composition__sun{font-size:94px;color:var(--yellow);line-height:1}
.welcome-composition__block>div>span{color:#b5dfc0;font-weight:800;font-size:10px;letter-spacing:.15em}
.welcome-composition__block h3{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;line-height:1.25;letter-spacing:-.04em;margin:12px 0 0}
.welcome-composition__note{position:absolute;right:-25px;bottom:8px;transform:rotate(-6deg);background:var(--yellow);border-radius:12px;padding:23px;max-width:208px;box-shadow:0 14px 25px #18452b25}
.welcome-composition__note p{margin:8px 0 0;font-size:12px;line-height:1.65;font-weight:700}
.section-heading-row{display:flex;align-items:end;justify-content:space-between;gap:25px;margin-bottom:39px}
.section-heading-row .inline-cta{white-space:nowrap;flex-shrink:0;margin:0 0 5px}
.program-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.program-card{position:relative;padding:28px 29px;min-height:344px;border-radius:17px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s,box-shadow .2s}
.program-card:hover{transform:translateY(-7px);box-shadow:0 20px 36px #163e241a}
.program-card--yellow{background:#f9df85}.program-card--mint{background:#c9e7d4}.program-card--lavender{background:#e6ddec}
.program-card:before{content:'';position:absolute;inset:auto -100px -170px auto;width:290px;height:290px;border:1px solid #355f4c30;border-radius:50%;box-shadow:0 0 0 30px #ffffff22,0 0 0 70px #ffffff22}
.program-card__upper{display:flex;justify-content:space-between;align-items:start;gap:20px;position:relative;z-index:1}
.program-card__number{font-size:10px;letter-spacing:.1em;font-weight:800;color:#3e604d}
.program-card__icon{display:grid;place-items:center;border:1px solid #2b6a4a55;border-radius:50%;width:65px;height:65px;background:#ffffff5a;color:#28593e}
.program-card h3{font-family:'Manrope',sans-serif;font-weight:800;color:#1a4633;letter-spacing:-.05em;font-size:27px;margin:0 0 12px;position:relative;z-index:1}
.program-card p{margin:0;color:#3c624e;max-width:265px;font-size:13px;line-height:1.75;position:relative;z-index:1}
.program-card__arrow{position:absolute;right:26px;bottom:26px;display:grid;place-items:center;width:38px;height:38px;background:#1b6040;color:#fff;border-radius:50%}
.program-card--large .program-card{min-height:420px}
.pillars-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:52px}
.pillar-card{border-top:1px solid #d9e8dd;padding-top:25px;position:relative}
.pillar-icon{width:69px;height:69px;display:grid;place-items:center;border-radius:17px;background:#e8f3e8;color:#1b6140}
.pillar-icon--2{background:#fff0b6;color:#795a12}.pillar-icon--3{background:#f0eaf5;color:#6b4c76}
.pillar-card__number{position:absolute;right:0;top:42px;font-size:12px;color:#a3b1a5;font-weight:800}
.pillar-card h3{font-family:'Manrope',sans-serif;font-size:19px;letter-spacing:-.04em;color:var(--primary-dark);margin:24px 0 11px}
.pillar-card p{font-size:13px;line-height:1.8;color:#637b6b;max-width:320px;margin:0}
.life-feature{background:white}
.experience-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:19px}
.experience-card{height:313px;border-radius:16px;display:flex;flex-direction:column;justify-content:space-between;padding:29px;color:#fff;position:relative;overflow:hidden}
.experience-card--1{background:#225d44}.experience-card--2{background:#edc848;color:#17412e}.experience-card--3{background:#305a50}
.experience-card:before{content:'';position:absolute;right:-70px;top:35px;border:1px solid currentColor;opacity:.12;border-radius:50%;width:240px;height:240px;box-shadow:0 0 0 30px #ffffff16,0 0 0 60px #ffffff16}
.experience-card__symbol{width:69px;height:69px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;opacity:.94}
.experience-card__content{position:relative;z-index:1}
.experience-card__content>span{font-size:10px;letter-spacing:.14em;font-weight:800;opacity:.75}
.experience-card h3{font-size:24px;font-weight:800;font-family:'Manrope',sans-serif;letter-spacing:-.045em;margin:8px 0 10px}
.experience-card p{font-size:12px;line-height:1.75;max-width:260px;margin:0;opacity:.82}
.experience-card__stripe{position:absolute;height:8px;left:0;right:0;bottom:0;background:var(--yellow)}
.experience-card--2 .experience-card__stripe{background:#245b3e}
.news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.news-card{background:white;border:1px solid #e4eae2;border-radius:15px;overflow:hidden;box-shadow:0 10px 27px #103f2810}
.news-card__visual{height:196px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#cae3d1}
.news-card__visual--2{background:#fae3a0}.news-card__visual--3{background:#e7dcee}
.news-card__visual:before{content:'';position:absolute;border:2px solid #25563a25;width:280px;height:280px;border-radius:50%;left:-40px;top:-165px;box-shadow:0 0 0 40px #ffffff28,0 0 0 80px #ffffff28}
.news-card__shape{font-size:121px;line-height:1;color:#1e6847a8;transform:rotate(-16deg)}.news-card__visual--2 .news-card__shape{color:#c68b1f99}.news-card__visual--3 .news-card__shape{color:#79588999}
.news-card__tag{position:absolute;left:17px;bottom:16px;background:white;border-radius:5px;padding:7px 10px;font-size:9px;font-weight:800;letter-spacing:.1em;color:#285a42}
.news-card__body{padding:27px 24px 23px;display:flex;flex-direction:column;min-height:239px}
.news-card__sample{font-size:9px;letter-spacing:.1em;color:#799181;font-weight:800}
.news-card h3{font-family:'Manrope',sans-serif;font-size:18px;line-height:1.35;letter-spacing:-.035em;color:var(--primary-dark);margin:12px 0 12px}
.news-card p{color:#697d70;font-size:12px;line-height:1.75;margin:0 0 19px}
.news-card__end{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:10px;color:var(--primary);font-weight:800}
.cta-wrap{padding:88px 0;background:#fff}
.cta-panel{position:relative;background:var(--primary-dark);padding:75px 80px;border-radius:22px;overflow:hidden;color:white;min-height:373px}
.cta-panel__content{position:relative;z-index:1;max-width:620px}
.eyebrow-on-dark{font-size:10px;letter-spacing:.16em;font-weight:800;color:#cae4c9}
.cta-panel h2{font-family:'Manrope',sans-serif;letter-spacing:-.06em;line-height:1.18;font-size:clamp(32px,4vw,53px);margin:15px 0 16px}
.cta-panel h2 em{font-style:normal;color:var(--yellow)}
.cta-panel p{font-size:14px;line-height:1.8;color:#bad0c2;margin:0 0 25px;max-width:475px}
.cta-panel__flower{position:absolute;right:105px;top:55px;font-size:225px;line-height:1;color:var(--yellow);transform:rotate(19deg)}
.cta-panel__decor{position:absolute;border:2px solid #bfe8b52c;border-radius:50%}
.cta-panel__decor--one{width:420px;height:420px;right:-170px;top:-250px}
.cta-panel__decor--two{width:470px;height:470px;right:-160px;bottom:-340px}
.footer{background:#0d3529;color:white;padding:80px 0 24px}
.footer__top{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr;gap:52px;padding-bottom:66px}
.brand--inverse .brand__mark{background:var(--yellow);color:var(--primary-dark)}
.brand--inverse .brand__words strong{color:#fff}
.brand--inverse .brand__words small{color:#aec8b5}
.footer__intro p{max-width:280px;font-size:13px;line-height:1.8;color:#a9c2af;margin:21px 0}
.footer__pill{display:inline-flex;align-items:center;gap:15px;padding:9px 12px;border-radius:30px;background:#ffffff10;border:1px solid #ffffff25;font-size:11px;color:#dae9d7}
.footer__pill>span{color:var(--yellow);font-size:19px}
.footer h3{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--yellow);font-weight:800;margin:6px 0 22px}
.footer__links{display:flex;flex-direction:column;gap:15px}
.footer__links a,.footer__contact a,.footer__contact p{color:#b5cbbd;font-size:12px;line-height:1.5;margin:0}
.footer__links a:hover,.footer__contact a:hover{color:white;text-decoration:underline}
.footer__contact{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.footer__contact h3{margin-bottom:4px}
.footer__bottom{border-top:1px solid #ffffff22;padding-top:23px;display:flex;justify-content:space-between;gap:25px;font-size:10px;color:#a6bfae}
.footer__bottom>span:last-child span{color:var(--yellow)}
/* Interior pages */
.page-hero{background:var(--primary-dark);padding:91px 0 95px;color:white;position:relative;overflow:hidden}
.page-hero:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#ffffff28 1px,transparent 1px);background-size:27px 27px;opacity:.3}
.page-hero__inner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:50px}
.page-hero__inner>div:first-child{position:relative;z-index:1;max-width:820px}
.page-hero__kicker{display:inline-flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.15em;font-weight:800;color:#d0e8d5}
.page-hero__kicker span{font-size:20px;color:var(--yellow)}
.page-hero h1{font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:-.07em;font-size:clamp(38px,5.4vw,68px);line-height:1.14;max-width:790px;margin:20px 0 22px}
.page-hero p{color:#c2d4c8;font-size:15px;line-height:1.85;max-width:670px;margin:0}
.page-hero__symbol{font-size:280px;line-height:.7;color:var(--yellow);opacity:.24;transform:rotate(15deg);font-weight:800}
